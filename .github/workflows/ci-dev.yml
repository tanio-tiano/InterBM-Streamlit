name: CI - Development

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Optionally provide a dev API key stored in repository secrets as DEV_GOOGLE_API_KEY
      GOOGLE_API_KEY: ${{ secrets.DEV_GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ] || [ -f pytest.ini ] || grep -q "pytest" requirements.txt 2>/dev/null; then
            pytest -q || true
          else
            echo "No tests found, skipping"
          fi

      - name: Lint (optional)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          else
            echo "flake8 not installed, skipping"
          fi
