name: CI - Production

on:
  push:
    branches: [ main ]

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    env:
      # In production use the secret GOOGLE_API_KEY set in repository or org secrets
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ] || [ -f pytest.ini ] || grep -q "pytest" requirements.txt 2>/dev/null; then
            pytest -q
          else
            echo "No tests found, skipping"
          fi

      - name: Lint (optional)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          else
            echo "flake8 not installed, skipping"
          fi

      - name: Post-build (placeholder)
        run: |
          echo "Add deploy steps here (e.g. upload artifact, call deployment API, etc.)"
